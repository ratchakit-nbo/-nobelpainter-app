<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบทดสอบสูตรคูณ แม่ 2-12 สุดสนุก</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            min-height: 100vh;
            padding: 20px;
            color: #1f2937;
            position: relative;
            overflow-x: hidden;
        }

        /* เอฟเฟกต์หิมะเครื่องหมายคณิตศาสตร์ */
        .snow-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .math-symbol {
            position: absolute;
            top: -50px;
            color: rgba(255, 255, 255, 0.25);
            font-size: 24px;
            font-weight: bold;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-50px) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0.2;
            }
        }

        /* โครงสร้างหน้าเว็บ */
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            position: relative;
            z-index: 2;
        }

        h1 {
            text-align: center;
            color: #4f46e5;
            margin-bottom: 10px;
            font-weight: 700;
            font-size: 2.2rem;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .table-section {
            background: #f9fafb;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03);
            transition: transform 0.2s;
        }

        .table-section:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.05);
        }

        .table-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 15px;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-title span:last-child {
            font-size: 0.9rem;
            color: #7c3aed;
            background: #ede9fe;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 500;
        }

        .question-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding: 12px 16px;
            background: #fff;
            border-radius: 12px;
            border: 1px solid #f3f4f6;
            transition: all 0.3s;
        }

        .question-text {
            font-weight: 600;
            font-size: 1.15rem;
            min-width: 100px;
            color: #111827;
        }

        .choices-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .choice-label {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #f3f4f6;
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            font-size: 1.05rem;
        }

        .choice-label:hover {
            background: #e0e7ff;
            color: #4f46e5;
        }

        .choice-label input {
            accent-color: #4f46e5;
            width: 16px;
            height: 16px;
        }

        .btn-container {
            text-align: center;
            margin-top: 35px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            border: none;
            padding: 14px 36px;
            font-size: 1.15rem;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.6);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
            box-shadow: 0 6px 16px rgba(107, 114, 128, 0.4);
        }

        .btn-secondary:hover {
            box-shadow: 0 8px 20px rgba(107, 114, 128, 0.6);
        }

        .result-box {
            margin-top: 30px;
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            font-size: 1.25rem;
            font-weight: 600;
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .result-normal {
            background: #eef2ff;
            color: #3730a3;
            border: 1px solid #c7d2fe;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            .question-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            .choices-group {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>

    <!-- พื้นหลังเอฟเฟกต์หิมะสัญลักษณ์คณิตศาสตร์ -->
    <div class="snow-container" id="snowContainer"></div>

    <div class="container">
        <h1>✨ แบบทดสอบสูตรคูณ แม่ 2 - 12 ✨</h1>
        <p class="subtitle">สุ่มโจทย์แม่ละ 5 ช่อง เติมพลังสมองกันเถอะ!</p>

        <div id="quizContainer"></div>

        <div class="btn-container">
            <button class="btn" onclick="checkAnswers()">ตรวจคำตอบ</button>
            <button class="btn btn-secondary" onclick="generateQuiz()">สุ่มโจทย์ใหม่</button>
        </div>

        <div id="resultBox" class="result-box"></div>
    </div>

    <script>
        let questionMap = {};

        // ฟังก์ชันสร้างตัวเลือกผิดรอบๆ ค่าจริง +-2
        function getWrongChoices(ans) {
            let potentialOffsets = [-2, -1, 1, 2, -3, 3];
            potentialOffsets.sort(() => Math.random() - 0.5);
            let wrongs = [];
            for (let off of potentialOffsets) {
                let w = ans + off;
                if (w > 0 && w !== ans && !wrongs.includes(w)) {
                    wrongs.push(w);
                }
                if (wrongs.length === 3) break;
            }
            // ป้องกันกรณีเผื่อไม่ครบ
            while (wrongs.length < 3) {
                let randOff = Math.floor(Math.random() * 5) + 1;
                let w = ans + (Math.random() > 0.5 ? randOff : -randOff);
                if (w > 0 && w !== ans && !wrongs.includes(w)) {
                    wrongs.push(w);
                }
            }
            return wrongs;
        }

        // สร้างแบบทดสอบ
        function generateQuiz() {
            const quizContainer = document.getElementById('quizContainer');
            const resultBox = document.getElementById('resultBox');
            quizContainer.innerHTML = '';
            resultBox.style.display = 'none';
            questionMap = {};

            for (let i = 2; i <= 12; i++) {
                // สุ่มตัวคูณ 5 ตัวที่ไม่ซ้ำกันจาก 1-12
                let multipliers = [];
                for (let m = 1; m <= 12; m++) multipliers.push(m);
                multipliers.sort(() => Math.random() - 0.5);
                let selectedMultipliers = multipliers.slice(0, 5).sort((a, b) => a - b);

                let section = document.createElement('div');
                section.className = 'table-section';

                let title = document.createElement('div');
                title.className = 'table-title';
                title.innerHTML = `<span>สูตรคูณแม่ ${i}</span> <span>สุ่ม 5 ข้อ</span>`;
                section.appendChild(title);

                selectedMultipliers.forEach(j => {
                    let qKey = `q_${i}_${j}`;
                    let correctAns = i * j;
                    questionMap[qKey] = correctAns;

                    let wrongAnsList = getWrongChoices(correctAns);
                    let choices = [correctAns, ...wrongAnsList];
                    choices.sort(() => Math.random() - 0.5); // สลับตำแหน่งตัวเลือก

                    let row = document.createElement('div');
                    row.className = 'question-row';
                    row.id = `row_${qKey}`;

                    let qText = document.createElement('div');
                    qText.className = 'question-text';
                    qText.innerHTML = `${i} &times; ${j} = ...`;

                    let choicesGroup = document.createElement('div');
                    choicesGroup.className = 'choices-group';

                    choices.forEach(choice => {
                        let label = document.createElement('label');
                        label.className = 'choice-label';
                        label.innerHTML = `
                            <input type="radio" name="${qKey}" value="${choice}">
                            <span>${choice}</span>
                        `;
                        choicesGroup.appendChild(label);
                    });

                    row.appendChild(qText);
                    row.appendChild(choicesGroup);
                    section.appendChild(row);
                });

                quizContainer.appendChild(section);
            }
        }

        // ฟังก์ชันตรวจคำตอบ
        function checkAnswers() {
            let score = 0;
            let total = Object.keys(questionMap).length;
            let unanswered = 0;

            for (let qKey in questionMap) {
                let radios = document.getElementsByName(qKey);
                let row = document.getElementById(`row_${qKey}`);
                let selectedVal = null;

                for (let r of radios) {
                    if (r.checked) {
                        selectedVal = parseInt(r.value);
                        break;
                    }
                }

                // รีเซ็ตสไตล์เดิม
                row.style.border = '1px solid #f3f4f6';
                row.style.background = '#fff';

                if (selectedVal === null) {
                    unanswered++;
                    row.style.border = '1px solid #f59e0b';
                    row.style.background = '#fffbeb';
                } else if (selectedVal === questionMap[qKey]) {
                    score++;
                    row.style.border = '1px solid #10b981';
                    row.style.background = '#ecfdf5';
                } else {
                    row.style.border = '1px solid #ef4444';
                    row.style.background = '#fef2f2';
                }
            }

            let resultBox = document.getElementById('resultBox');
            resultBox.style.display = 'block';

            if (unanswered > 0) {
                resultBox.className = 'result-box result-normal';
                resultBox.innerHTML = `⚠️ คุณยังทำไม่ครบทุกข้อ (เหลืออีก ${unanswered} ข้อ) | คะแนนของคุณ: <b>${score}</b> / ${total}`;
            } else if (score === total) {
                resultBox.className = 'result-box result-success';
                resultBox.innerHTML = `🎉 ยอดเยี่ยมมาก! คุณตอบถูกครบทุกข้อ (${score}/${total}) เก่งสุดๆ ไปเลย! 🏆`;
            } else {
                resultBox.className = 'result-box result-normal';
                resultBox.innerHTML = `✨ ตรวจเรียบร้อยแล้ว! คะแนนของคุณ: <b>${score}</b> / ${total} ข้อ`;
            }

            resultBox.scrollIntoView({ behavior: 'smooth' });
        }

        // ฟังก์ชันสร้างหิมะสัญลักษณ์คณิตศาสตร์
        function createSnow() {
            const snowContainer = document.getElementById('snowContainer');
            const symbols = ['+', '-', '×', '÷', '2', '5', '9', '12', '='];
            const count = 35;

            for (let i = 0; i < count; i++) {
                let el = document.createElement('div');
                el.className = 'math-symbol';
                el.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                el.style.left = Math.random() * 100 + 'vw';
                el.style.fontSize = (Math.random() * 22 + 16) + 'px';
                
                let duration = Math.random() * 8 + 6; // ความเร็ว 6-14 วินาที
                let delay = Math.random() * 5;
                el.style.animationDuration = duration + 's';
                el.style.animationDelay = delay + 's';
                
                snowContainer.appendChild(el);
            }
        }

        // เริ่มต้นการทำงานเมื่อโหลดหน้าเว็บ
        window.onload = function() {
            generateQuiz();
            createSnow();
        };
    </script>
</body>
</html>
